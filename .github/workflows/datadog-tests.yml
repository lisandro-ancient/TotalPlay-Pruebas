name: Datadog Tests

on:
  push:
    branches: [master]
    paths:
      - 'datadog-tests/**'
      - '.github/workflows/datadog-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'datadog-tests/**'
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, ui, api, websocket]

env:
  NODE_VERSION: '20'
  WORKING_DIR: datadog-tests

jobs:
  # ──────────────────────────────────────────────
  # UI Tests
  # ──────────────────────────────────────────────
  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'ui' || github.event_name != 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      DD_BASE_URL: ${{ secrets.DD_BASE_URL }}
      DD_USERNAME: ${{ secrets.DD_USERNAME }}
      DD_PASSWORD: ${{ secrets.DD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run UI tests
        run: npx playwright test --project=ui

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: ${{ env.WORKING_DIR }}/allure-results
          retention-days: 7

      - name: Upload videos & traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-evidence
          path: |
            ${{ env.WORKING_DIR }}/test-results/**/*.webm
            ${{ env.WORKING_DIR }}/test-results/**/*.zip
            ${{ env.WORKING_DIR }}/test-results/**/*.png
          retention-days: 7

  # ──────────────────────────────────────────────
  # API Tests
  # ──────────────────────────────────────────────
  api:
    name: API Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'api' || github.event_name != 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      DD_API_BASE_URL: ${{ secrets.DD_API_BASE_URL }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=api
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: ${{ env.WORKING_DIR }}/allure-results
          retention-days: 7

  # ──────────────────────────────────────────────
  # WebSocket Tests
  # ──────────────────────────────────────────────
  websocket:
    name: WebSocket Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'websocket' || github.event_name != 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      DD_WS_URL: ${{ secrets.DD_WS_URL }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run WebSocket tests
        run: npx playwright test --project=websocket
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-websocket
          path: ${{ env.WORKING_DIR }}/allure-results
          retention-days: 7

  # ──────────────────────────────────────────────
  # Allure Report → GitHub Pages
  # ──────────────────────────────────────────────
  report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [ui, api, websocket]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-combined
          merge-multiple: true

      - name: Load previous Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into results
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results-combined/history
            cp -r gh-pages/history/. allure-results-combined/history/
          fi

      - name: Install Allure CLI
        run: npm install -g allure-commandline --silent

      - name: Generate Allure report
        run: allure generate allure-results-combined --clean -o allure-report

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
